RegisterUserRequest:
  type: object
  required:
    - name
    - email
    - password
  properties:
    name:
      type: string
      minLength: 2
      maxLength: 100
      example: Santiago Castaño
    email:
      type: string
      format: email
      maxLength: 254
      example: usuario@example.com
    password:
      type: string
      minLength: 8
      format: password

LoginRequest:
  type: object
  required:
    - email
    - password
  properties:
    email:
      type: string
      format: email
      example: usuario@example.com
    password:
      type: string
      format: password