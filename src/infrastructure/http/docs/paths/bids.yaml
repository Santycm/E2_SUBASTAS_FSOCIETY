
/api/v1/auctions/{id}/bids:
  parameters:
    - name: id
      in: path
      required: true
      description: Identificador de la subasta.
      schema:
        type: string
        pattern: "^[0-9a-fA-F]{24}$"

  post:
    tags:
      - Ofertas
    summary: Realizar una oferta
    description: El postor se obtiene del JWT. Las ofertas rechazadas también se registran y devuelven el motivo del rechazo.
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - amount
            properties:
              amount:
                type: integer
                minimum: 1
                example: 1600000
          example:
            amount: 1600000
    responses:
      "201":
        description: Oferta aceptada.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BidResult"
      "400":
        description: Oferta rechazada por las reglas de negocio o importe inválido.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BidResult"
      "401":
        description: Token ausente o inválido.
      "404":
        description: Subasta no encontrada.
      "500":
        description: Error interno del servidor.

  get:
    tags:
      - Ofertas
    summary: Listar ofertas de una subasta
    security:
      - bearerAuth: []
    responses:
      "200":
        description: Lista de ofertas.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/Bid"
      "400":
        description: Identificador inválido.
      "401":
        description: Token ausente o inválido.
      "404":
        description: Subasta no encontrada.
