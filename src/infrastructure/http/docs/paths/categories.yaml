
/api/v1/categories:
  get:
    tags:
      - Categorías
    summary: Listar categorías
    description: Obtiene todas las categorías registradas.
    responses:
      "200":
        description: Lista de categorías.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/Category"

  post:
    tags:
      - Categorías
    summary: Crear categoría
    description: Requiere autenticación JWT.
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - name
              - description
            properties:
              name:
                type: string
                minLength: 1
                example: "Electrónica"
              description:
                type: string
                minLength: 1
                example: "Equipos electrónicos"
          example:
            name: "Electrónica"
            description: "Equipos electrónicos"
    responses:
      "201":
        description: Categoría creada.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Category"
      "400":
        description: Datos de entrada inválidos.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
      "401":
        description: Token ausente o inválido.
      "500":
        description: Error interno del servidor.

/api/v1/categories/{id}:
  parameters:
    - name: id
      in: path
      required: true
      description: Identificador MongoDB de la categoría.
      schema:
        type: string
        pattern: "^[0-9a-fA-F]{24}$"
      example: "507f1f77bcf86cd799439011"
  get:
    tags:
      - Categorías
    summary: Consultar categoría por ID
    responses:
      "200":
        description: Categoría encontrada.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Category"
      "400":
        description: Identificador inválido.
      "404":
        description: Categoría no encontrada.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
