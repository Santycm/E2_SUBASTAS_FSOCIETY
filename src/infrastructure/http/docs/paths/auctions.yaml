/api/v1/auctions:
  get:
    tags:
      - Subastas
    summary: Listar subastas
    description: Permite filtrar por categoría y estado, y paginar resultados.
    parameters:
      - name: categoryId
        in: query
        required: false
        schema:
          type: string
          pattern: "^[0-9a-fA-F]{24}$"
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum: [OPEN, CLOSED, CANCELLED, NO_BIDS]
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
    responses:
      "200":
        description: Subastas y metadatos de paginación.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuctionList"
      "400":
        description: Filtros inválidos.

  post:
    tags:
      - Subastas
    summary: Crear subasta
    description: El vendedor se obtiene del usuario autenticado. La duración debe estar entre una hora y treinta días.
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - title
              - description
              - categoryId
              - basePrice
              - minimumIncrement
              - closesAt
            properties:
              title:
                type: string
                minLength: 1
                example: "Portátil gaming"
              description:
                type: string
                minLength: 1
                example: "Portátil gaming en buen estado"
              categoryId:
                type: string
                pattern: "^[0-9a-fA-F]{24}$"
                example: "507f1f77bcf86cd799439011"
              basePrice:
                type: integer
                minimum: 1
                example: 1500000
              minimumIncrement:
                type: integer
                minimum: 1
                example: 50000
              closesAt:
                type: string
                format: date-time
                example: "2026-11-20T18:00:00.000Z"
          example:
            title: "Portátil gaming"
            description: "Portátil gaming en buen estado"
            categoryId: "507f1f77bcf86cd799439011"
            basePrice: 1500000
            minimumIncrement: 50000
            closesAt: "2026-11-20T18:00:00.000Z"
    responses:
      "201":
        description: Subasta creada.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Auction"
      "400":
        description: Datos inválidos o duración de subasta no permitida.
      "401":
        description: Token ausente o inválido.

/api/v1/auctions/{id}:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-fA-F]{24}$"
  get:
    tags:
      - Subastas
    summary: Consultar subasta por ID
    description: Puede cerrar automáticamente la subasta si su fecha de cierre ya pasó.
    responses:
      "200":
        description: Subasta encontrada.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Auction"
      "400":
        description: Identificador inválido.
      "404":
        description: Subasta no encontrada.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"

/api/v1/auctions/{id}/cancel:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-fA-F]{24}$"
  patch:
    tags:
      - Subastas
    summary: Cancelar subasta
    description: Solo el vendedor puede cancelar su subasta y únicamente cuando no tiene ofertas actuales.
    security:
      - bearerAuth: []
    responses:
      "200":
        description: Subasta cancelada.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Auction"
      "400":
        description: Identificador inválido.
      "401":
        description: Token ausente o inválido.
      "403":
        description: El usuario no es propietario de la subasta.
      "404":
        description: Subasta no encontrada.
      "409":
        description: La subasta tiene ofertas y no puede cancelarse.
